name: Build et Test App React

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app-base-reactjs

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-base-reactjs/package-lock.json

      - name: Installation des dependances
        run: npm install

      - name: Build de l application
        run: npm run build

      - name: Demarrage de l application
        run: npm start &
        env:
          CI: true
          BROWSER: none

      - name: Attente du demarrage du serveur
        run: |
          echo "Attente du demarrage du serveur..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Le serveur est pret"
              exit 0
            fi
            echo "Tentative $i: Le serveur n est pas encore pret..."
            sleep 2
          done
          echo "Le serveur n a pas demarre"
          exit 1

      - name: Verification de l application avec curl
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          if [ "$response" = "200" ]; then
            echo "L application fonctionne correctement (HTTP $response)"
          else
            echo "L application a retourne HTTP $response"
            exit 1
          fi
